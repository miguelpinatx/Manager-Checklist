<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#f6f5f2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Manager Log">
<title>Manager Daily Log</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231f6b45'/><path d='M30 34h40M30 50h40M30 66h26' stroke='white' stroke-width='9' stroke-linecap='round'/></svg>">
<style>:root{
  --bg:#f6f5f2; --card:#fff; --ink:#1c1f1d; --ink-2:#5b625d; --ink-3:#8b918d; --line:#e3e1db;
  --green:#1f6b45; --green-soft:#e8f2ec;
  --amber:#a8630f; --amber-soft:#fdf1de;
  --red:#a4322a; --red-soft:#fbeceb;
  --blue:#25567f; --blue-soft:#e9f0f6;
  --plum:#6b4a7a; --plum-soft:#f2ecf5;
  --clay:#7a4a12; --clay-soft:#f6eede;
  --radius:14px; --shadow:0 1px 2px rgba(28,31,29,.05),0 4px 14px rgba(28,31,29,.045); --tap:44px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;padding-bottom:118px;-webkit-text-size-adjust:100%}
button,select,textarea,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none !important}
.wrap{max-width:840px;margin:0 auto;padding:0 14px}
@media(min-width:840px){.wrap{padding:0 20px}}

/* header */
header.top{position:sticky;top:0;z-index:50;background:rgba(246,245,242,.94);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:12px;padding:10px 0}
.brand{font-weight:700;letter-spacing:-.01em;font-size:15px;line-height:1.25;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-weight:500;color:var(--ink-2);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{display:flex;gap:6px;flex-shrink:0}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 13px;font-size:13px;font-weight:600;color:var(--ink-2);min-height:38px;display:inline-flex;align-items:center;white-space:nowrap}
.chip:active{transform:scale(.97)}
.progress-wrap{padding-bottom:10px}
.bar{height:7px;background:#e3e1db;border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--green);border-radius:99px;transition:width .25s}
.bar-label{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--ink-2);margin-bottom:5px;font-variant-numeric:tabular-nums}
.bar-label b{color:var(--ink);font-weight:700}
.queue{display:block;text-align:center;font-size:12px;font-weight:700;color:var(--amber);background:var(--amber-soft);border-radius:8px;padding:5px;margin-bottom:8px}

/* setup */
.setup{padding:26px 0 40px}
.setup h1{font-size:26px;line-height:1.15;letter-spacing:-.02em;margin:0 0 6px}
.setup p.sub{color:var(--ink-2);margin:0 0 24px;font-size:15px}
.field{margin-bottom:20px}
.field>label{display:block;font-size:12.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.field input[type=text]{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--card);min-height:var(--tap)}
.field input[type=text]:focus{outline:2px solid var(--green);outline-offset:-1px;border-color:transparent}
.shift-grid{display:grid;gap:10px}
.shift-btn{text-align:left;border:1.5px solid var(--line);background:var(--card);border-radius:var(--radius);padding:15px 16px;display:flex;align-items:center;gap:13px;box-shadow:var(--shadow)}
.shift-btn.on{border-color:var(--green);background:var(--green-soft)}
.shift-btn .dot{width:11px;height:11px;border-radius:99px;border:2px solid var(--ink-3);flex-shrink:0}
.shift-btn.on .dot{border-color:var(--green);background:var(--green);box-shadow:inset 0 0 0 2px #fff}
.shift-btn .nm{font-weight:650;letter-spacing:-.01em}
.shift-btn .wd{font-size:13px;color:var(--ink-2)}
.toggle-row{display:flex;gap:9px;flex-wrap:wrap}
.toggle{border:1.5px solid var(--line);background:var(--card);border-radius:999px;padding:10px 16px;font-size:14px;font-weight:600;color:var(--ink-2);min-height:var(--tap)}
.toggle.on{background:var(--blue);border-color:var(--blue);color:#fff}
.hint{font-size:13px;color:var(--ink-3);margin-top:8px;line-height:1.45}
.primary{width:100%;background:var(--green);color:#fff;border-radius:13px;padding:16px;font-weight:700;font-size:16px;min-height:52px;box-shadow:var(--shadow);text-align:center}
.primary.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}

/* blocks */
.block{margin:22px 0 0}
.block>h2{font-size:12.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--green);margin:0 0 9px;padding:0 2px;display:flex;align-items:center;gap:9px}
.block>h2::after{content:"";flex:1;height:1px;background:var(--line)}

/* department card */
.dept{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:11px;box-shadow:var(--shadow);overflow:hidden}
.dept-head{display:flex;align-items:center;gap:10px;padding:14px 15px;width:100%;text-align:left;min-height:60px}
.dept-head .nm{font-weight:700;letter-spacing:-.01em;flex:1;min-width:0;font-size:16px}
.dept-head .mins{font-size:12px;color:var(--ink-3);font-weight:600;flex-shrink:0}
.pill{font-size:11.5px;font-weight:700;border-radius:999px;padding:5px 10px;flex-shrink:0;white-space:nowrap}
.pill.s-none{background:#f1efe9;color:var(--ink-3)}
.pill.s-good{background:var(--green-soft);color:var(--green)}
.pill.s-attn{background:var(--amber-soft);color:var(--amber)}
.pill.s-skip{background:var(--red-soft);color:var(--red)}
.caret{width:10px;height:10px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);transition:transform .2s;flex-shrink:0;margin-top:-4px}
.dept.open .caret{transform:rotate(-135deg);margin-top:2px}
.dept-body{border-top:1px solid var(--line);padding:13px 15px 15px}

/* guide */
.guide{border:1px solid var(--line);border-radius:11px;background:#faf9f6;margin-bottom:13px;overflow:hidden}
.guide summary{list-style:none;cursor:pointer;padding:11px 13px;font-size:13px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:6px;min-height:42px}
.guide summary::-webkit-details-marker{display:none}
.guide summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);margin-left:auto;margin-top:-3px;transition:transform .2s}
.guide[open] summary::after{transform:rotate(-135deg);margin-top:2px}
.guide summary b{color:var(--ink-3);font-weight:700}
.guide ul{margin:0;padding:2px 15px 13px 30px;color:var(--ink-2);font-size:14px;line-height:1.5}
.guide li{margin:3px 0}
.guide li.gh{list-style:none;margin-left:-16px;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);padding-top:9px}

/* status */
.statusrow{display:flex;gap:7px;margin-bottom:13px}
.st{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:11px 6px;font-size:13px;font-weight:700;color:var(--ink-2);min-height:46px;line-height:1.2}
.st.on.st-good{background:var(--green);border-color:var(--green);color:#fff}
.st.on.st-attn{background:var(--amber);border-color:var(--amber);color:#fff}
.st.on.st-skip{background:var(--red);border-color:var(--red);color:#fff}

/* prompts */
.prompts{background:var(--blue-soft);border-radius:11px;padding:11px 13px;margin-bottom:13px}
.prompts>span{display:block;font-size:11px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--blue);margin-bottom:5px}
.prompts ul{margin:0;padding-left:17px;font-size:13.5px;line-height:1.5;color:#2f4d68}
.prompts li{margin:2px 0}

/* entries */
.entry{border:1px solid var(--line);border-left:4px solid var(--ink-3);border-radius:11px;padding:10px;margin-bottom:9px;background:#fff}
.entry-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.etype{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 9px;border-radius:999px;white-space:nowrap}
.entry .route{flex:1;min-width:0;border:1px solid var(--line);border-radius:9px;padding:8px 9px;background:#fff;font-size:13px;min-height:38px}
.entry .del{width:34px;height:34px;border-radius:9px;font-size:19px;color:var(--ink-3);flex-shrink:0;display:flex;align-items:center;justify-content:center}
.entry textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px;resize:vertical;min-height:70px;font-size:15px;line-height:1.4;background:#fff}
.entry textarea:focus{outline:2px solid var(--green);outline-offset:-1px;border-color:transparent}
.e-issue{border-left-color:var(--red)} .e-issue .etype{background:var(--red-soft);color:var(--red)}
.e-concern{border-left-color:var(--amber)} .e-concern .etype{background:var(--amber-soft);color:var(--amber)}
.e-win{border-left-color:var(--green)} .e-win .etype{background:var(--green-soft);color:var(--green)}
.e-product{border-left-color:var(--clay)} .e-product .etype{background:var(--clay-soft);color:var(--clay)}
.e-staffing{border-left-color:var(--plum)} .e-staffing .etype{background:var(--plum-soft);color:var(--plum)}

/* add row */
.addrow{display:flex;gap:7px;flex-wrap:wrap;margin-top:2px}
.add{border:1.5px dashed #cfccc3;background:#fff;border-radius:999px;padding:8px 13px;font-size:13px;font-weight:700;color:var(--ink-2);min-height:40px}
.add:active{transform:scale(.97)}
.a-issue{color:var(--red);border-color:#e3c4c1}
.a-concern{color:var(--amber);border-color:#e8d3b2}
.a-win{color:var(--green);border-color:#bcd6c8}
.a-product{color:var(--clay);border-color:#dfcfae}
.a-staffing{color:var(--plum);border-color:#d5c6dd}

/* footer */
.footbar{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 0 max(10px,env(safe-area-inset-bottom))}
.footbar .wrap{display:flex;gap:9px}
.footbar button{flex:1;border-radius:12px;padding:14px 10px;font-weight:700;font-size:14.5px;min-height:50px;border:1px solid var(--line);background:#fff;color:var(--ink)}
.footbar button.go{background:var(--green);color:#fff;border-color:var(--green);flex:1.5}

/* sheet */
.sheet{position:fixed;inset:0;z-index:100;background:rgba(28,31,29,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet-in{background:var(--bg);width:100%;max-width:840px;max-height:92vh;border-radius:20px 20px 0 0;display:flex;flex-direction:column;overflow:hidden}
@media(min-width:840px){.sheet{align-items:center}.sheet-in{border-radius:20px;max-height:86vh}}
.sheet-head{display:flex;align-items:center;gap:12px;padding:16px 16px 12px;border-bottom:1px solid var(--line)}
.sheet-head h3{margin:0;font-size:17px;flex:1;letter-spacing:-.01em}
.sheet-body{overflow:auto;padding:14px 16px;-webkit-overflow-scrolling:touch}
.sheet-body p{margin-top:0;font-size:14.5px;color:var(--ink-2);line-height:1.5}
.sheet-foot{padding:12px 16px max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:9px;background:#fff}
.sheet-foot button{flex:1;border-radius:12px;padding:14px 8px;font-weight:700;min-height:50px;border:1px solid var(--line);background:#fff;font-size:14.5px}
.sheet-foot button.go{background:var(--green);color:#fff;border-color:var(--green);flex:1.3}
.sheet-foot button:disabled{opacity:.6}
.x{width:34px;height:34px;border-radius:99px;background:#eceae4;display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--ink-2);line-height:1}
pre.report{white-space:pre-wrap;word-wrap:break-word;font:11.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin:0}
@media(min-width:560px){pre.report{font-size:13px}}
.sent{font-size:12.5px;color:var(--green);font-weight:600;margin:-4px 0 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:14px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat b{display:block;font-size:21px;line-height:1.1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.stat.issue b{color:var(--red)} .stat.win b{color:var(--green)}

.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(8px);z-index:200;background:var(--ink);color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;box-shadow:0 6px 22px rgba(0,0,0,.22);max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media print{
  header.top,.footbar,.addrow,.statusrow,.chip{display:none!important}
  body{background:#fff;padding:0}
  .dept-body{display:block!important}
  .dept{break-inside:avoid;box-shadow:none}
}

/* ---------- shift tabs ---------- */
.tabbar{display:flex;gap:5px;padding:0 0 10px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabbar::-webkit-scrollbar{display:none}
.stab{
  flex:1 1 0;min-width:0;border:1.5px solid var(--line);background:var(--card);border-radius:11px;
  padding:9px 6px;font-size:13px;font-weight:700;color:var(--ink-2);min-height:42px;
  display:inline-flex;align-items:center;justify-content:center;gap:5px;white-space:nowrap;
}
@media(min-width:420px){ .stab{padding:9px 12px;font-size:13.5px} }
.stab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.stab .tdot{width:7px;height:7px;border-radius:99px;background:var(--amber);flex-shrink:0}
.stab .tmark{font-size:12px;color:var(--green);font-weight:800}
.stab.on .tmark{color:#8fd3ae}

/* ---------- per-shift name bar ---------- */
.namebar{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:13px 15px;margin-top:16px;box-shadow:var(--shadow);
}
.namebar label{display:block;font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px}
.namebar input{width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:11px;background:#fff;min-height:var(--tap)}
.namebar input:focus{outline:2px solid var(--green);outline-offset:-1px;border-color:transparent}
.sentmark{display:inline-block;margin-top:9px;font-size:12.5px;font-weight:700;color:var(--green)}

/* ---------- end-of-list actions ---------- */
.endcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin:22px 0 10px;box-shadow:var(--shadow)}
.endcard h3{margin:0 0 6px;font-size:18px;letter-spacing:-.015em}
.endcard p{margin:0 0 14px;font-size:14.5px;color:var(--ink-2);line-height:1.5}
.endcard .primary{margin-bottom:9px}
.endcard .hint{margin-top:2px}
.primary.danger,.sheet-foot button.danger{color:var(--red);border-color:#e3c4c1}
.sheet-foot button.go.danger{background:var(--red);border-color:var(--red);color:#fff}

.bigcheck{width:64px;height:64px;border-radius:99px;background:var(--green-soft);color:var(--green);
  font-size:30px;font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.d-none{background:#d8d5cd}
.repeat{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid var(--line);font-size:14.5px}
.repeat:first-of-type{border-top:0}
.repeat .dot{width:9px;height:9px;border-radius:99px;margin-top:7px;flex-shrink:0;display:inline-block}
.d-good{background:var(--green)} .d-warn{background:var(--amber)} .d-bad{background:var(--red)}

/* ---------- last 3 days ---------- */
.recenthead{display:flex;align-items:center;gap:12px;padding:16px 0 12px}
.recenthead b{font-size:16px;letter-spacing:-.01em}
.recenthead span{font-size:13px;color:var(--ink-2)}
.loading{color:var(--ink-3);font-size:15px;text-align:center;padding:34px 0}
.rshift{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 15px;margin-bottom:10px;box-shadow:var(--shadow)}
.rshift-head{display:flex;align-items:baseline;gap:9px;margin-bottom:10px}
.rshift-head b{font-size:15px}
.rshift-head span{font-size:13px;color:var(--ink-3)}
.rent{border-left:3px solid var(--line);padding:2px 0 2px 11px;margin-bottom:11px}
.rent:last-child{margin-bottom:0}
.rent-top{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:4px}
.rent .tag{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:999px}
.rdept{font-size:13px;font-weight:700}
.rroute{font-size:11px;font-weight:700;color:var(--ink-3);border:1px solid var(--line);border-radius:999px;padding:2px 7px}
.rent p{margin:0;font-size:14.5px;line-height:1.45;white-space:pre-wrap}
.rnone{margin:0;font-size:13.5px;color:var(--ink-3)}
.t-Issue{border-left-color:var(--red)} .t-Issue .tag{background:var(--red-soft);color:var(--red)}
.t-Concern{border-left-color:var(--amber)} .t-Concern .tag{background:var(--amber-soft);color:var(--amber)}
.t-Product{border-left-color:var(--clay)} .t-Product .tag{background:var(--clay-soft);color:var(--clay)}
.t-Staffing{border-left-color:var(--plum)} .t-Staffing .tag{background:var(--plum-soft);color:var(--plum)}
.t-Win{border-left-color:var(--green)} .t-Win .tag{background:var(--green-soft);color:var(--green)}

/* ================= iPad and other big screens ================= */
@media(min-width:900px){
  .wrap{max-width:1120px;padding:0 20px}

  /* departments sit two-up when closed; the open one takes the full width */
  .block{display:grid;grid-template-columns:1fr 1fr;column-gap:12px;align-items:start}
  .block > h2{grid-column:1 / -1}
  .dept.open{grid-column:1 / -1}

  /* a bit more room to read and tap */
  .dept-head{min-height:64px;padding:15px 17px}
  .dept-head .nm{font-size:17px}
  .dept-body{padding:15px 17px 17px}
  .st{font-size:14px;min-height:50px}
  .add{font-size:14px;min-height:44px;padding:9px 15px}
  .entry textarea{min-height:84px;font-size:16px}
  .guide ul{font-size:14.5px}
  .prompts ul{font-size:14.5px}
  .lbl,.namebar input{font-size:16px}
  .sheet-in{max-width:900px}
  .footbar button{font-size:15.5px;min-height:54px}
}

/* landscape iPad: the screen is short, so give the chrome less of it */
@media(min-width:900px) and (max-height:900px){
  .top-row{padding:7px 0;gap:10px}
  .brand{font-size:14px}
  .brand small{font-size:12px}
  .progress-wrap{padding-bottom:7px}
  .bar-label{margin-bottom:4px}
  .tabbar{padding-bottom:7px}
  .stab{min-height:38px;padding:7px 10px}
  .footbar{padding:7px 0 max(7px,env(safe-area-inset-bottom))}
  .footbar button{min-height:46px;padding:11px 10px}
  .block{margin-top:16px}
}

/* while the on-screen keyboard is up, get the fixed bar out of the way */
body.typing .footbar{display:none}

/* compact the "who's on" bar on big screens — it's one short name */
@media(min-width:900px){
  .namebar{display:flex;align-items:center;gap:14px;padding:11px 17px;margin-top:14px}
  .namebar label{margin:0;flex-shrink:0;font-size:12.5px}
  .namebar input{flex:1;min-height:42px;padding:10px 13px}
  .sentmark{margin-top:0;flex-shrink:0}
}
</style>
</head>
<body>

<header class="top hidden" id="topbar">
  <div class="wrap">
    <div class="top-row">
      <div class="brand" id="brandline"></div>
      <div class="top-actions">
        <button class="chip" id="daybtn">Day type</button>
        <button class="chip" id="menubtn" aria-label="Menu">•••</button>
      </div>
    </div>
    <div class="progress-wrap" id="progress">
      <span class="queue hidden" id="queuechip"></span>
      <div class="bar-label"><span id="pctnum"></span><span id="pctright"></span></div>

<script>/* =========================================================
   SETUP — fill these in before you upload the file.

   1. endpoint : the Google Apps Script web app address,
                 the one that ends in /exec.
   2. stores   : one line per store. Keep the id short,
                 lowercase, no spaces — it's what goes in
                 each store's link, e.g.  ?store=alameda

   Give each store its own link:
       https://you.github.io/Manager-Checklist/?store=alameda
   ========================================================= */
const CONFIG = {
  endpoint: "https://script.google.com/macros/s/AKfycbwijs3yoqt7cRnzqGC2024sDKDUpOHhAQAph9A5bjY-Vsq9KUvOKPmYNA2W7lPvor-v/exec",
  stores: [
    { id: "central", name: "Central" },
    { id: "alameda", name: "Alameda" },
    { id: "horizon", name: "Horizon" },
    { id: "urban", name: "Urban" },
    { id: "doniphan", name: "Doniphan" },
    { id: "piedras", name: "Piedras" },
    { id: "montana", name: "Montana" }
  ]
};

/* ================= constants ================= */
const KEY="mgr-v4", HKEY="mgr-history-v4", OKEY="mgr-outbox-v4", CKEY="mgr-config-v4",
      SKEY="mgr-store-v4", CODEKEY="mgr-code-v4";
const RETAIN_DAYS = 15;
const LOOKBACK_DAYS = 3;
const ROUTES = ["Higher Management","HR","Commissary","Maintenance"];
const TYPES = {
  issue:   {label:"Issue",           short:"Issue",    routed:true,  hint:"What's wrong, how bad, and what you need."},
  concern: {label:"Concern",         short:"Concern",  routed:true,  hint:"Not a problem yet, but trending the wrong way."},
  win:     {label:"Win",             short:"Win",      routed:false, hint:"What went well — and who deserves the credit."},
  product: {label:"Product & waste", short:"Product",  routed:true,  hint:"Ran out, thrown away, over-produced, order needs adjusting."},
  staffing:{label:"Staffing",        short:"Staffing", routed:true,  hint:"Call-outs, coverage, coaching given, uniform and hygiene."}
};
const TYPE_ORDER = ["issue","concern","product","staffing","win"];
const STATUS = {
  good:{label:"All good",        short:"All good"},
  attn:{label:"Needs attention", short:"Attention"},
  skip:{label:"Didn't get to it",short:"Not covered"}
};
const RECENT = "recent";

const $=(s,r)=>(r||document).querySelector(s);
const $$=(s,r)=>Array.from((r||document).querySelectorAll(s));
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function todayKey(d){d=d||new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function prettyDate(k){const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric",year:"numeric"});}
function shortDate(k){const[y,m,d]=k.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:"long",month:"short",day:"numeric"});}
function daysBetween(a,b){return Math.round((new Date(b)-new Date(a))/864e5);}
const SHIFT_IDS = DATA.map(s=>s.id);

/* ================= config, store, code ================= */
let CFG = Object.assign({}, CONFIG);
try{ const c=JSON.parse(localStorage.getItem(CKEY)||"null"); if(c && c.endpoint) CFG.endpoint=c.endpoint; }catch(e){}
function saveCfg(){ try{ localStorage.setItem(CKEY, JSON.stringify({endpoint:CFG.endpoint})); }catch(e){} }

let CODE = "";
try{ CODE = localStorage.getItem(CODEKEY) || ""; }catch(e){}
function setCode(c){ CODE=(c||"").trim(); try{ CODE? localStorage.setItem(CODEKEY,CODE) : localStorage.removeItem(CODEKEY); }catch(e){} }

let STORE = null;
function stores(){ return (CFG.stores||[]).filter(s=>s && s.id && s.name); }
function storeFromUrl(){
  try{
    const q=new URLSearchParams(location.search).get("store");
    if(!q) return null;
    const k=q.trim().toLowerCase();
    return stores().find(s=> s.id.toLowerCase()===k || s.name.toLowerCase()===k) || null;
  }catch(e){ return null; }
}
function setStore(st){ STORE=st; try{ st? localStorage.setItem(SKEY,JSON.stringify(st)) : localStorage.removeItem(SKEY); }catch(e){} }
function resolveStore(){
  const u=storeFromUrl();
  if(u){ setStore(u); return; }
  let raw=null; try{ raw=new URLSearchParams(location.search).get("store"); }catch(e){}
  if(raw && raw.trim()){ STORE=null; return; }        // link named a store we don't know — ask, don't guess
  let saved=null; try{ saved=JSON.parse(localStorage.getItem(SKEY)||"null"); }catch(e){}
  if(saved && stores().some(s=>s.id===saved.id)){ STORE=saved; return; }
  if(stores().length===1){ setStore(stores()[0]); return; }
  STORE=null;
}
resolveStore();

/* ================= wrap-up department ================= */
const WRAPUP = {
  name:"Shift wrap-up", wrap:true,
  guide:[
    "Anything that needs a decision from higher management",
    "Anything HR needs to know — call-outs, conduct, hours, coaching",
    "Anything commissary needs — product quality, quantities, sell-by dates",
    "Repairs or equipment that need scheduling"
  ],
  report:["How the shift ran overall","Anything the next manager needs to pick up"]
};
DATA.forEach(sh=> sh.blocks.push({ time:"End of shift", depts:[WRAPUP] }));

/* ================= state ================= */
function defaultShift(){
  const h=new Date().getHours();
  return h<13 ? "opening" : (h<15 ? "second" : "closing");
}
function blank(){
  return { v:4, date:todayKey(), store:STORE?STORE.name:"", storeId:STORE?STORE.id:"",
           day:{order:false,delivery:false,tue:new Date().getDay()===2},
           shift:defaultShift(), managers:{}, sent:{}, depts:{}, seq:1, open:{}, started:false };
}
let S = blank();

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
function readHistory(){ try{ return JSON.parse(localStorage.getItem(HKEY)||"[]"); }catch(e){ return []; } }
function writeHistory(h){ try{ localStorage.setItem(HKEY, JSON.stringify(h)); }catch(e){} }
function pruneHistory(){
  const t=todayKey();
  const h=readHistory().filter(e=> daysBetween(e.date,t) < RETAIN_DAYS);
  writeHistory(h); return h;
}
function archiveAll(st){
  if(!st) return;
  let h=readHistory();
  SHIFT_IDS.forEach(sid=>{
    if(!hasContent(st,sid)) return;
    h = h.filter(e=> !(e.date===st.date && e.shiftId===sid));
    h.unshift({ date:st.date, shiftId:sid, shift:(shiftDef(sid)||{}).name||sid,
                manager:(st.managers||{})[sid]||"", report:buildReport(st,sid) });
  });
  writeHistory(h); pruneHistory();
}
function load(){
  let saved=null;
  try{ saved=JSON.parse(localStorage.getItem(KEY)||"null"); }catch(e){}
  pruneHistory();
  if(!saved || saved.v!==4) return;
  if(saved.date !== todayKey()){ archiveAll(saved); S=blank(); save(); return; }
  S=saved;
  S.open=S.open||{}; S.managers=S.managers||{}; S.sent=S.sent||{};
  if(STORE && S.storeId && S.storeId!==STORE.id){ archiveAll(S); S=blank(); save(); return; }
  if(STORE){ S.store=STORE.name; S.storeId=STORE.id; }
  if(SHIFT_IDS.indexOf(S.shift)<0 && S.shift!==RECENT) S.shift=defaultShift();
}

/* ================= content helpers ================= */
function shiftDef(id){ return DATA.find(s=>s.id===id); }
function tagOK(tag, st){ st=st||S; return !tag || !!st.day[tag]; }
function deptList(st,sid){
  st=st||S; sid=sid||st.shift;
  const def=shiftDef(sid), out=[];
  if(!def) return out;
  def.blocks.forEach((b,bi)=> b.depts.forEach((d,di)=> out.push({d, id:sid+"."+bi+"."+di, block:b.time, bi, di})));
  return out;
}
function drec(id){ return S.depts[id] || (S.depts[id]={s:null,e:[]}); }

function counts(st,sid){
  st=st||S; sid=sid||st.shift;
  let total=0,good=0,attn=0,skip=0,entries=0,issues=0;
  deptList(st,sid).forEach(({id})=>{
    total++;
    const r=(st.depts||{})[id]||{};
    if(r.s==="good")good++; else if(r.s==="attn")attn++; else if(r.s==="skip")skip++;
    (r.e||[]).forEach(en=>{ if((en.x||"").trim()){ entries++; if(en.t==="issue") issues++; } });
  });
  const reported=good+attn+skip;
  return {total,good,attn,skip,entries,issues,reported,pct: total?Math.round(reported/total*100):0};
}
function hasContent(st,sid){
  st=st||S;
  const c=counts(st,sid);
  return c.reported>0 || c.entries>0;
}

/* ================= setup screen ================= */
function renderSetup(){
  $("#topbar").classList.add("hidden");
  $("#footbar").classList.add("hidden");
  const h=pruneHistory();
  $("#app").innerHTML = `
  <div class="wrap setup">
    <h1>Manager Daily Log</h1>
    <p class="sub">${prettyDate(S.date)}${STORE?" · "+esc(STORE.name):""}</p>

    ${STORE?"":`<div class="field">
      <label>Which store?</label>
      <div class="shift-grid" id="storepick">
        ${stores().map(st=>`<button class="shift-btn" data-store="${esc(st.id)}"><span class="dot"></span><span class="nm">${esc(st.name)}</span></button>`).join("")}
      </div>
      <p class="hint">Ask for your store's own link and this question disappears for good.</p>
    </div>`}

    ${CODE?"":`<div class="field">
      <label for="code">Store code</label>
      <input type="text" id="code" placeholder="Ask your manager for this" autocomplete="off" autocapitalize="off" spellcheck="false">
      <p class="hint">One time only, on this phone. It's what lets this phone send reports and read the last few days.</p>
    </div>`}

    <div class="field">
      <label>What kind of day is it?</label>
      <div class="toggle-row" id="daytoggles">
        <button class="toggle${S.day.order?" on":""}" data-d="order">Order day</button>
        <button class="toggle${S.day.delivery?" on":""}" data-d="delivery">Delivery day</button>
        <button class="toggle${S.day.tue?" on":""}" data-d="tue">Price changes</button>
      </div>
      <p class="hint">These add the order, delivery and price-change reminders to the departments they apply to. Any manager can change it later.</p>
    </div>

    <button class="primary" id="start">Start the day</button>
    ${h.length?`<button class="primary ghost" id="pastbtn" style="margin-top:10px">This phone's past days (${h.length})</button>`:""}
    <p class="hint" style="margin-top:16px">All three shifts live on one screen — tap between them at the top. Nothing to tick off: walk the store, and write down what's worth telling somebody.</p>
  </div>`;

  $$("#storepick .shift-btn").forEach(b=>b.addEventListener("click",()=>{
    $$("#storepick .shift-btn").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    setStore(stores().find(x=>x.id===b.dataset.store)||null);
    S.store=STORE?STORE.name:""; S.storeId=STORE?STORE.id:""; save();
    $(".setup .sub").textContent=prettyDate(S.date)+(STORE?" · "+STORE.name:"");
  }));
  $$("#daytoggles .toggle").forEach(b=>b.addEventListener("click",()=>{
    b.classList.toggle("on"); S.day[b.dataset.d]=b.classList.contains("on"); save();
  }));
  $("#start").addEventListener("click",()=>{
    if(!STORE){ toast("Pick your store first"); return; }
    if($("#code")) setCode($("#code").value);
    S.started=true; save(); renderMain();
  });
  if($("#pastbtn")) $("#pastbtn").addEventListener("click", showHistory);
}

/* ================= main view ================= */
function renderMain(){
  $("#topbar").classList.remove("hidden");
  $("#footbar").classList.remove("hidden");
  renderTabs();
  if(S.shift===RECENT) renderRecent(); else renderShift();
  refresh();
}

function renderTabs(){
  $("#tabs").innerHTML = SHIFT_IDS.map(id=>{
    const def=shiftDef(id);
    const state = S.sent[id] ? "sent" : (hasContent(S,id) ? "wip" : "");
    return `<button class="stab${S.shift===id?" on":""}${state?" "+state:""}" data-tab="${id}">
      ${esc(def.short)}${state==="sent"?'<span class="tmark">✓</span>':(state==="wip"?'<span class="tdot"></span>':"")}
    </button>`;
  }).join("") + `<button class="stab${S.shift===RECENT?" on":""}" data-tab="${RECENT}">${LOOKBACK_DAYS} days</button>`;

  $$("#tabs .stab").forEach(b=> b.addEventListener("click",()=>{
    if(S.shift===b.dataset.tab) return;
    S.shift=b.dataset.tab; save();
    renderMain();
    window.scrollTo({top:0});
  }));
}

function renderShift(){

  let html='<div class="wrap">';

function deptHTML(d,bi,di){

function entryHTML(deptId,en){

    <div class="entry-top">

/* ================= interactions ================= */
function wireApp(){
  const app=$("#app");
  app.addEventListener("click", e=>{
    const t=e.target.closest("[data-open],[data-status],[data-add],[data-del]");
    if(!t) return;

    if(t.dataset.open){
      const id=t.dataset.open;
      const nowOpen = S.open[id]!==true;
      Object.keys(S.open).forEach(k=> S.open[k]=false);   // only one department open at a time
      S.open[id]=nowOpen; save();
      paintOpen();
      if(nowOpen) scrollDeptIntoView(id);
      return;
    }
    if(t.dataset.status){
      const [id,k]=t.dataset.status.split(":"); const r=drec(id);
      r.s = (r.s===k? null : k);
      const card=t.closest(".dept");
      $$(".st",card).forEach(b=> b.classList.toggle("on", b.dataset.status===id+":"+r.s));
      card.classList.toggle("has-status", !!r.s);
      // stays open on purpose — logging a status is often followed by writing a note
      save(); refresh(); return;
    }
    if(t.dataset.add){
      const [id,type]=t.dataset.add.split(":"); const r=drec(id);
      const en={i:S.seq++, t:type, r:TYPES[type].routed?(type==="staffing"?"HR":"Higher Management"):"", x:""};
      r.e.push(en);
      if(!r.s) r.s=(type==="win"?"good":"attn");
      else if((type==="issue"||type==="concern") && r.s==="good") r.s="attn";
      save();
      $(`[data-entries="${id}"]`).insertAdjacentHTML("beforeend", entryHTML(id,en));
      const card=t.closest(".dept");
      $$(".st",card).forEach(b=> b.classList.toggle("on", b.dataset.status===id+":"+r.s));
      card.classList.add("has-status");
      const ta=$(`[data-text="${id}:${en.i}"]`); if(ta) ta.focus();
      refresh(); return;
    }
    if(t.dataset.del){
      const [id,i]=t.dataset.del.split(":"); const r=drec(id);
      r.e=r.e.filter(x=>String(x.i)!==i); save();
      const el=t.closest(".entry"); if(el) el.remove();
      refresh(); return;
    }
  });

  app.addEventListener("input", e=>{
    const el=e.target;
    if(el.dataset.text!=null){
      const [id,i]=el.dataset.text.split(":");
      const en=(drec(id).e||[]).find(x=>String(x.i)===i);
      if(en){ en.x=el.value; save(); refresh(); }
    }
  });
  app.addEventListener("change", e=>{
    const el=e.target;
    if(el.dataset.route!=null){
      const [id,i]=el.dataset.route.split(":");
      const en=(drec(id).e||[]).find(x=>String(x.i)===i);
      if(en){ en.r=el.value; save(); }
    }
  });
}

function paintOpen(){
  $$(".dept").forEach(c=>{
    const on = S.open[c.dataset.dept]===true;
    c.classList.toggle("open", on);
    const body=$(".dept-body",c); if(body) body.classList.toggle("hidden", !on);
  });
}
function scrollDeptIntoView(id){
  const card=$(`[data-dept="${id}"]`); if(!card) return;
  requestAnimationFrame(()=>{
    const head=$("#topbar");
    const offset=(head?head.offsetHeight:0)+8;
    const y=card.getBoundingClientRect().top + window.scrollY - offset;
    window.scrollTo({top:Math.max(0,y), behavior:"smooth"});
  });
}

function refresh(){
  const def=shiftDef(S.shift);
  $("#brandline").innerHTML = `${STORE?esc(STORE.name):"Manager Daily Log"}<small>${prettyDate(S.date)}</small>`;

  if(S.shift===RECENT){
    $("#progress").classList.add("hidden");
    $("#footbar").classList.add("hidden");
    return;
  }
  $("#progress").classList.remove("hidden");

  const bits=[];

  if(c.entries) bits.push(c.entries+" note"+(c.entries>1?"s":""));
  $("#pctright").textContent = bits.join(" · ") || "nothing logged yet";

/* ================= report ================= */
function collect(st,sid){
  st=st||S; sid=sid||st.shift;
  const out={issues:[],concern:[],win:[],product:[],staffing:[],skipped:[]};
  deptList(st,sid).forEach(({d,id,block})=>{
    const r=(st.depts||{})[id]||{};
    if(r.s==="skip") out.skipped.push(d.name);
    (r.e||[]).forEach(en=>{
      const x=(en.x||"").trim(); if(!x) return;
      const row={dept:d.name, block, type:en.t, route:en.r||"", text:x};
      if(en.t==="issue") out.issues.push(row); else out[en.t].push(row);
    });
  });
  return out;
}

function buildReport(st,sid){
  st=st||S; sid=sid||st.shift;
  const def=shiftDef(sid); if(!def) return "";
  const c=counts(st,sid), g=collect(st,sid), L=[];
  const D="---------------------------------";

  L.push("MANAGER DAILY LOG — "+def.name.toUpperCase());
  if(st.store) L.push("Store: "+st.store);
  L.push(prettyDate(st.date));
  const mgr=(st.managers||{})[sid]||"";
  if(mgr) L.push("Manager: "+mgr);
  const dt=[st.day.order&&"Order day",st.day.delivery&&"Delivery day",st.day.tue&&"Price changes"].filter(Boolean);
  if(dt.length) L.push("Day type: "+dt.join(", "));
  L.push("Departments logged: "+c.reported+" of "+c.total+"  ("+c.good+" all good, "+c.attn+" need attention, "+c.skip+" not covered)");
  L.push("");

  if(g.issues.length){
    L.push(D); L.push("ISSUES ("+g.issues.length+")"); L.push(D);
    ROUTES.concat([""]).forEach(rt=>{
      const rows=g.issues.filter(i=>(i.route||"")===rt);
      if(!rows.length) return;
      L.push(""); L.push("> "+(rt||"UNROUTED").toUpperCase());
      rows.forEach(r=> L.push("  ["+r.dept+"] "+r.text));
    });
    L.push("");
  }
  [["concern","CONCERNS / WATCH ITEMS"],["product","PRODUCT & WASTE"],["staffing","STAFFING"],["win","WINS"]].forEach(([k,title])=>{
    if(!g[k].length) return;
    L.push(D); L.push(title+" ("+g[k].length+")"); L.push(D);
    g[k].forEach(r=> L.push("  ["+r.dept+"]"+(r.route?" ("+r.route+")":"")+" "+r.text));
    L.push("");
  });
  if(g.skipped.length){ L.push(D); L.push("NOT COVERED THIS SHIFT"); L.push(D); L.push("  "+g.skipped.join(", ")); L.push(""); }
  if(!g.issues.length&&!g.concern.length&&!g.product.length&&!g.staffing.length&&!g.win.length)
    L.push("No issues, concerns or notes recorded this shift.");
  return L.join("\n");
}

function payload(st,sid){
  st=st||S; sid=sid||st.shift;
  const def=shiftDef(sid), c=counts(st,sid), entries=[];
  deptList(st,sid).forEach(({d,id,block})=>{
    const r=(st.depts||{})[id]||{};
    (r.e||[]).forEach(en=>{
      const x=(en.x||"").trim(); if(!x) return;
      entries.push({department:d.name, block, status:r.s||"", type:TYPES[en.t].label, route:en.r||"", text:x});
    });
  });
  return {
    code: CODE,
    store: st.store||(STORE?STORE.name:""),
    storeId: st.storeId||(STORE?STORE.id:""),
    date: st.date,
    shift: def?def.name:sid,
    shiftId: sid,
    manager: (st.managers||{})[sid]||"",
    dayType: [st.day.order&&"Order day",st.day.delivery&&"Delivery day",st.day.tue&&"Price changes"].filter(Boolean).join(", "),
    counts:c,
    depts: deptList(st,sid).map(({d,id})=>({name:d.name, status:(st.depts[id]||{}).s||""})),
    entries,
    report: buildReport(st,sid)
  };
}

/* ================= sending ================= */
function outbox(){ try{ return JSON.parse(localStorage.getItem(OKEY)||"[]"); }catch(e){ return []; } }
function setOutbox(o){ try{ localStorage.setItem(OKEY, JSON.stringify(o)); }catch(e){} }

async function postOnce(p){
  if(!CFG.endpoint) throw new Error("no-endpoint");
  const res=await fetch(CFG.endpoint,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(p),redirect:"follow"});
  const txt=await res.text();
  let j=null; try{ j=JSON.parse(txt); }catch(e){}
  if(j && j.error==="bad-code"){ const e=new Error("bad-code"); e.fatal=true; throw e; }
  if(!res.ok || (j && j.ok===false)) throw new Error((j&&j.error)||("HTTP "+res.status));
  return j||{ok:true};
}

async function flushOutbox(silent){
  const o=outbox(); if(!o.length||!CFG.endpoint) return;
  const left=[];
  for(const p of o){
    p.code=CODE;
    try{ await postOnce(p); }
    catch(e){ if(!e.fatal) left.push(p); }
  }
  setOutbox(left); updateQueueChip();
  if(!silent && !left.length) toast("Queued reports sent");
}
function updateQueueChip(){
  const n=outbox().length, el=$("#queuechip"); if(!el) return;
  el.classList.toggle("hidden", n===0);
  el.textContent=n+" waiting to send";
}

async function sendShift(sid, quiet){
  const p=payload(S,sid);
  if(!CFG.endpoint){ if(!quiet) askEndpoint(); return false; }
  if(!CODE){ if(!quiet) askCode(); return false; }
  try{
    await postOnce(p);
    S.sent[sid]=new Date().toISOString(); save();
    return true;
  }catch(err){
    if(err.fatal){ setCode(""); if(!quiet) askCode("That store code wasn't accepted. Try again."); return false; }
    const o=outbox().filter(x=>!(x.date===p.date && x.shiftId===p.shiftId && x.store===p.store));
    o.push(p); setOutbox(o);
    S.sent[sid]=new Date().toISOString(); save();
    updateQueueChip();
    if(!quiet) toast("No connection — saved and it will send itself later");
    return true;
  }
}

function askCloseDay(){
  const withContent=SHIFT_IDS.filter(id=>hasContent(S,id));
  const unsent=withContent.filter(id=>!S.sent[id]);
  const rows=SHIFT_IDS.map(id=>{
    const def=shiftDef(id);

      <div><b>${esc(def.name)}</b><br><span style="color:var(--ink-2)">${esc(state)}</span></div></div>`;
  }).join("");

  openSheet("Close out the day", `
    <p style="margin-top:0">This files today away and clears the screen so tomorrow starts clean. You can still read today under <b>This phone's past days</b>.</p>
    ${rows}
    ${unsent.length?`<p style="margin-top:14px"><b>${unsent.length} shift${unsent.length>1?"s":""}</b> will be sent to the office first.</p>`:""}

async function doCloseDay(){
  const b=$("#cdbtn"); if(b){ b.disabled=true; b.textContent="Closing…"; }

  archiveAll(S);
  const st=STORE;
  S=blank(); S.store=st?st.name:""; S.storeId=st?st.id:"";
  save();
  closeSheet();
  renderClosed();
}

/* ================= last 3 days ================= */
let RECENT_CACHE=null;
function renderRecent(){
  $("#app").innerHTML=`<div class="wrap">
    <div class="recenthead">
      <div><b>What's been reported</b><br><span>Every shift at ${esc(STORE?STORE.name:"this store")}, last ${LOOKBACK_DAYS} days</span></div>
      <button class="chip" id="rrefresh">Refresh</button>
    </div>
    <div id="recentbody"><p class="loading">Loading…</p></div>
  </div>`;
  $("#rrefresh").addEventListener("click",()=>{ RECENT_CACHE=null; loadRecent(); });
  loadRecent();
}

async function loadRecent(){
  const box=$("#recentbody"); if(!box) return;
  if(!CFG.endpoint){ box.innerHTML='<p class="loading">This copy has no office link, so there is nothing to read back.</p>'; return; }
  if(!CODE){
    box.innerHTML=`<div class="endcard"><h3>Store code needed</h3>
      <p>Reading other managers' notes needs the store code. One time only, on this phone.</p>
      <button class="primary" id="rcode">Enter store code</button></div>`;
    $("#rcode").addEventListener("click",()=>askCode());
    return;
  }
  if(RECENT_CACHE){ paintRecent(RECENT_CACHE); return; }
  box.innerHTML='<p class="loading">Loading…</p>';
  try{
    const url=CFG.endpoint+"?action=recent&code="+encodeURIComponent(CODE)
      +"&store="+encodeURIComponent(STORE?STORE.name:"")+"&days="+LOOKBACK_DAYS;
    const res=await fetch(url,{redirect:"follow"});
    const j=await res.json();
    if(!j.ok) throw new Error(j.error||"failed");
    RECENT_CACHE=j; paintRecent(j);
  }catch(err){
    const bad=/code/i.test(String(err.message||""));
    box.innerHTML=`<div class="endcard"><h3>${bad?"That code wasn't accepted":"Couldn't load"}</h3>
      <p>${bad?"Check the store code with your manager.":"No connection, or the office link isn't reachable right now. Your own shifts are still under the menu, in this phone's past days."}</p>
      <button class="primary ghost" id="rretry">${bad?"Enter store code":"Try again"}</button></div>`;
    $("#rretry").addEventListener("click",()=> bad? askCode() : loadRecent());
  }
}

function paintRecent(j){
  const box=$("#recentbody");
  const entries=(j.entries||[]);
  const shifts=(j.shifts||[]);
  if(!shifts.length){ box.innerHTML='<p class="loading">Nothing has been sent in from this store in the last '+LOOKBACK_DAYS+' days.</p>'; return; }

  const openCount=entries.filter(e=>e.Type==="Issue").length;
  const days=[]; const byDay={};
  shifts.forEach(s=>{ if(!byDay[s.Date]){byDay[s.Date]=[];days.push(s.Date)} byDay[s.Date].push(s); });
  days.sort().reverse();

  let html=`<div class="stats" style="margin-bottom:16px">
    <div class="stat"><b>${shifts.length}</b><span>Shifts</span></div>
    <div class="stat issue"><b>${openCount}</b><span>Issues</span></div>
    <div class="stat win"><b>${entries.filter(e=>e.Type==="Win").length}</b><span>Wins</span></div>
  </div>`;

  days.forEach(d=>{
    html+=`<section class="block"><h2>${esc(shortDate(d))}${d===todayKey()?" · today":""}</h2>`;
    byDay[d].sort((a,b)=>String(a.Shift).localeCompare(String(b.Shift))).forEach(s=>{
      const mine=entries.filter(e=>e.Date===d && e.Shift===s.Shift);
      html+=`<div class="rshift">
        <div class="rshift-head"><b>${esc(s.Shift)}</b><span>${esc(s.Manager||"no name")}</span></div>
        ${mine.length? mine.map(e=>`<div class="rent t-${esc(String(e.Type).split(" ")[0])}">
            <div class="rent-top"><span class="tag">${esc(e.Type)}</span><span class="rdept">${esc(e.Department)}</span>${e["Route to"]?`<span class="rroute">→ ${esc(e["Route to"])}</span>`:""}</div>
            <p>${esc(e.Detail)}</p>
          </div>`).join("")
          : '<p class="rnone">No notes written this shift.</p>'}
      </div>`;
    });
    html+=`</section>`;
  });
  box.innerHTML=html;
}

/* ================= history / sheets / utils ================= */
function showHistory(){
  const h=pruneHistory();
  const body=h.length? h.map((e,i)=>`
    <div class="dept open" style="margin-bottom:9px">
      <button class="dept-head" data-h="${i}">
        <span class="nm">${esc(shortDate(e.date))}</span>
        <span class="pill s-good">${esc(e.shift||"")}</span>
        <span class="caret"></span>
      </button>
      <div class="dept-body hidden" style="padding:12px"><pre class="report">${esc(e.report)}</pre></div>
    </div>`).join("")
    : `<p>Nothing filed yet. Days you close out are kept here for ${RETAIN_DAYS} days.</p>`;
  openSheet("This phone's past days", body, [{label:"Close", cls:"go", fn:closeSheet}]);
  $$("[data-h]").forEach(b=> b.addEventListener("click",()=>{
    const c=b.closest(".dept"); c.classList.toggle("open"); $(".dept-body",c).classList.toggle("hidden");
  }));
}

function openSheet(title, bodyHTML, buttons){
  closeSheet();
  const el=document.createElement("div");
  el.className="sheet"; el.id="sheet";
  el.innerHTML=`<div class="sheet-in">
    <div class="sheet-head"><h3>${esc(title)}</h3><button class="x" id="sheetx">×</button></div>
    <div class="sheet-body">${bodyHTML}</div>
    <div class="sheet-foot" id="sheetfoot"></div>
  </div>`;
  document.body.appendChild(el);
  (buttons||[]).forEach(b=>{
    const btn=document.createElement("button");
    btn.textContent=b.label; if(b.cls) btn.className=b.cls; if(b.id) btn.id=b.id;
    btn.addEventListener("click", b.fn);
    $("#sheetfoot").appendChild(btn);
  });
  $("#sheetx").addEventListener("click", closeSheet);
  el.addEventListener("click", e=>{ if(e.target===el) closeSheet(); });
}
function closeSheet(){ const s=$("#sheet"); if(s) s.remove(); }

function toast(m){
  let t=$("#toast");
  if(!t){ t=document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t); }
  t.textContent=m; requestAnimationFrame(()=>t.classList.add("show"));
  clearTimeout(t._x); t._x=setTimeout(()=>t.classList.remove("show"),2400);
}
function copyText(txt){
  const done=()=>toast("Copied — paste it anywhere");
  const fb=()=>{ const ta=document.createElement("textarea"); ta.value=txt;
    ta.style.cssText="position:fixed;top:0;left:0;opacity:0"; document.body.appendChild(ta);
    ta.focus(); ta.select(); try{ document.execCommand("copy"); done(); }catch(e){ toast("Select the text to copy"); } ta.remove(); };
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done).catch(fb); else fb();
}
function download(txt,sid){
  const name="manager-log-"+S.date+"-"+(sid||S.shift)+".txt";
  const b=new Blob([txt],{type:"text/plain;charset=utf-8"}), u=URL.createObjectURL(b);
  const a=document.createElement("a"); a.href=u; a.download=name; document.body.appendChild(a); a.click();
  setTimeout(()=>{a.remove();URL.revokeObjectURL(u);},400);
  toast("Downloaded");
}

/* ================= chrome ================= */
function wireChrome(){
  $("#daybtn").addEventListener("click",()=>{
    const rows=[["order","Order day"],["delivery","Delivery day"],["tue","Price changes"]];
    openSheet("Today's day type",
      `<p style="margin-top:0">These add the matching reminders to each department's "what to look at" list, on every shift.</p>
       <div class="toggle-row" id="sheettoggles">${rows.map(([k,l])=>`<button class="toggle${S.day[k]?" on":""}" data-d="${k}">${l}</button>`).join("")}</div>`,
      [{label:"Done", cls:"go", fn:()=>{ closeSheet(); renderMain(); }}]);
    $$("#sheettoggles .toggle").forEach(b=>b.addEventListener("click",()=>{
      b.classList.toggle("on"); S.day[b.dataset.d]=b.classList.contains("on"); save();
    }));
  });

  $("#menubtn").addEventListener("click",()=>{
    const n=outbox().length;
    openSheet("Menu", `<div style="display:grid;gap:9px">
      <button class="primary ghost" id="m-past">This phone's past days</button>
      ${n?`<button class="primary ghost" id="m-flush">Send ${n} waiting report${n>1?"s":""}</button>`:""}
      ${stores().length>1?`<button class="primary ghost" id="m-store">Change store (now ${esc(STORE?STORE.name:"none")})</button>`:""}
      <button class="primary ghost" id="m-settings">Store code &amp; office link</button>
      <button class="primary ghost danger" id="m-close">Close out the day</button>
    </div>
    <p class="hint" style="margin-top:16px">Everything saves on this phone as you type. Days you close out are kept here for ${RETAIN_DAYS} days.</p>`,
    [{label:"Close", cls:"go", fn:closeSheet}]);

    $("#m-past").addEventListener("click",()=>{closeSheet();showHistory();});
    if($("#m-flush")) $("#m-flush").addEventListener("click",()=>{closeSheet();flushOutbox();});
    if($("#m-store")) $("#m-store").addEventListener("click",()=>{
      if(!confirm("Switch this phone to a different store? Anything logged today that hasn't been sent will be cleared.")) return;
      setStore(null); S=blank(); save(); closeSheet(); renderSetup();
    });
    $("#m-settings").addEventListener("click",()=>{
      openSheet("Settings", `
        <p style="margin-top:0">This phone logs as <b>${STORE?esc(STORE.name):"no store chosen"}</b>.</p>
        <div class="field"><label for="c3">Store code</label><input type="text" id="c3" value="${esc(CODE)}" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
        <div class="field"><label for="ep3">Office link</label><input type="text" id="ep3" value="${esc(CFG.endpoint||"")}" placeholder="https://script.google.com/macros/s/.../exec"></div>
        <p class="hint">Normally both are already set. Only change these if somebody tells you to.</p>`,
        [{label:"Save", cls:"go", fn:()=>{ setCode($("#c3").value); CFG.endpoint=$("#ep3").value.trim(); saveCfg(); RECENT_CACHE=null; closeSheet(); toast("Saved"); }},
         {label:"Cancel", fn:closeSheet}]);
    });
    $("#m-close").addEventListener("click",()=>{ closeSheet(); askCloseDay(); });
  });

  $("#summarybtn").addEventListener("click", showSummary);
  $("#collapsebtn").addEventListener("click",()=>{
    Object.keys(S.open).forEach(k=> S.open[k]=false);
    save(); paintOpen();
    window.scrollTo({top:0,behavior:"smooth"});
  });
}

wireChrome();
wireApp();

setInterval(()=>{
  if(S.date!==todayKey()){ archiveAll(S); S=blank(); save(); renderSetup(); }

}, 60000);

/* the iPad keyboard covers the bottom of the screen — hide the fixed bar while typing */
document.addEventListener("focusin", e=>{
  if(e.target.matches("textarea,input")) document.body.classList.add("typing");
});
document.addEventListener("focusout", e=>{
  if(e.target.matches("textarea,input")) setTimeout(()=>{
    const a=document.activeElement;
    if(!a || !a.matches("textarea,input")) document.body.classList.remove("typing");
  },80);
});
